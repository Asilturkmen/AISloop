<!doctype html>
<!--
  Kestrel is a fictional product (a field notebook for wildlife surveyors).
  This page is the AISloop list-detail example: patterns/list-detail.md.
  Query parameters: ?theme=light|dark  ?density=compact  ?selection=accent
                    ?empty=selection|list
  Narrow screens use the URL hash: #/moorland-2026 and #/moorland-2026/<note-id>.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kestrel: Moorland 2026</title>
<meta name="description" content="Kestrel is a fictional note-taking app for field researchers. This page is the AISloop list-detail example.">
<link rel="stylesheet" href="../../tokens/tokens.css">
<!-- Icons: Phosphor Icons (MIT), regular weight, official web package pinned to 2.1.1 -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
/* AISloop tokens only: no literal colours, type sizes, radii or durations.
   Raw px appear only for layout proportions (pane widths, breakpoints). */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; overflow: hidden;
  background: var(--color-bg); color: var(--color-label);
  font: var(--text-body); letter-spacing: var(--text-body-tracking);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, ul { margin: 0; }
button, input { font: inherit; letter-spacing: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
i.ph, i.ph-fill { font-size: var(--icon-size); line-height: 1; flex: none; }
:focus-visible { outline: var(--focus-ring-width) solid var(--color-focus-ring); outline-offset: var(--focus-ring-offset); }
.visually-hidden { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: clip; clip-path: inset(50%); white-space: nowrap; border: 0; }

/* ---------- Split view ---------- */
.split {
  position: relative; overflow: hidden; height: 100dvh;
  display: grid;
  grid-template-columns: var(--sidebar-width) clamp(320px, 30vw, 400px) minmax(0, 1fr);
}
.pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--color-bg); }
.pane-sources { background: var(--color-bg-sidebar); border-inline-end: 1px solid var(--color-separator); }
.pane-detail { border-inline-start: 1px solid var(--color-separator); }
.scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }

.bar {
  flex: none; display: flex; align-items: center; gap: var(--space-4);
  min-height: var(--bar-height); padding-inline: var(--space-8);
  border-bottom: 1px solid var(--color-separator);
}
.bar h2, .bar .brand {
  flex: 1; min-width: 0; padding-inline: var(--space-8);
  font: var(--text-headline); letter-spacing: var(--text-headline-tracking);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.bar .brand { display: flex; align-items: center; gap: var(--space-8); }
.bar .spacer { flex: 1; min-width: 0; }
.icon-btn {
  display: inline-grid; place-items: center; flex: none;
  min-width: var(--hit-min); height: var(--bar-item-height); padding: 0 var(--space-8);
  background: none; border: 0; border-radius: var(--radius-control); color: var(--color-label);
  transition: background-color var(--duration-short) var(--ease-out);
}
.icon-btn:hover { background: var(--color-fill-hover); }
.icon-btn:active { background: var(--color-fill-selected); }
.back-btn {
  display: none; align-items: center; gap: var(--space-4); flex: 0 1 auto; min-width: 0;
  min-height: var(--bar-item-height); padding: 0 var(--space-8) 0 var(--space-4);
  background: none; border: 0; border-radius: var(--radius-control); color: var(--color-accent-text);
}
.back-btn span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back-btn:hover { background: var(--color-fill-hover); }

/* ---------- Sidebar ---------- */
.pane-sources .scroll { padding: var(--space-16) var(--space-12) var(--space-24); }
.side-group + .side-group { margin-top: var(--space-16); }
.side-group h2 { font: var(--text-footnote); font-weight: var(--text-footnote-weight-emphasized); letter-spacing: var(--text-footnote-tracking); color: var(--color-label-secondary); padding: var(--space-8) var(--space-12); }
.side-list { list-style: none; padding: 0; display: grid; gap: var(--space-2); }
.side-item {
  display: flex; align-items: center; gap: var(--space-12);
  min-height: var(--row-height-sidebar); padding: var(--space-4) var(--space-12);
  border-radius: var(--radius-selection); color: inherit; text-decoration: none;
}
.side-item:hover { background: var(--color-fill-hover); }
.side-item[aria-current="page"] { background: var(--color-fill-selected); font-weight: var(--text-body-weight-emphasized); }
.side-item i { color: var(--color-label-secondary); }
.side-item[aria-current="page"] i { color: var(--color-label); }
.side-item .label { flex: 1; min-width: 0; overflow-wrap: break-word; }
.side-item .count { font: var(--text-footnote); letter-spacing: var(--text-footnote-tracking); color: var(--color-label-secondary); font-variant-numeric: tabular-nums; }
.side-item:focus-visible { outline-offset: calc(-1 * var(--focus-ring-width)); }

.bar-start, .bar-end, .actions { display: flex; align-items: center; gap: var(--space-4); flex: none; }
.side-item .chev { display: none; margin-inline-end: calc(var(--space-4) * -1); font-size: var(--icon-size-sm); color: var(--color-label-tertiary); }

/* ---------- List ---------- */
.list-search { flex: none; padding: var(--space-8) var(--space-12); border-bottom: 1px solid var(--color-separator); }
.search {
  display: flex; align-items: center; gap: var(--space-8);
  min-height: var(--control-height); padding-inline: var(--space-12);
  background: var(--color-fill-tertiary); border-radius: var(--radius-control);
  color: var(--color-label-secondary);
}
.search input { flex: 1; min-width: 0; background: none; border: 0; padding: 0; min-height: var(--control-height); font-size: var(--text-field-size); color: var(--color-label); }
.search input::placeholder { color: var(--color-label-secondary); opacity: 1; }
.search input:focus-visible { outline: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search:focus-within { outline: var(--focus-ring-width) solid var(--color-focus-ring); outline-offset: var(--focus-ring-offset); }
.search .clear { display: grid; place-items: center; flex: none; min-width: var(--hit-min); height: var(--control-height); margin-inline-end: calc(-1 * var(--space-12)); background: none; border: 0; border-radius: var(--radius-control); color: var(--color-label-secondary); }
.search .clear:hover { color: var(--color-label); }

.rows { list-style: none; padding: var(--space-4) var(--space-8) var(--space-16); }
.row {
  position: relative;
  display: grid; grid-template-columns: var(--space-8) minmax(0, 1fr) auto; column-gap: var(--space-8);
  align-content: center; align-items: start;
  min-height: max(var(--row-height-2line), var(--hit-min));
  padding: var(--pad-row-y) var(--pad-row-x);
  border-radius: var(--radius-selection);
  cursor: default; -webkit-tap-highlight-color: transparent;
}
.row::after { content: ""; position: absolute; bottom: 0; left: calc(var(--pad-row-x) + var(--space-16)); right: var(--pad-row-x); height: 1px; background: var(--color-separator); }
.row:last-child::after,
.row:hover::after, .row:has(+ .row:hover)::after,
.row[aria-selected="true"]::after, .row:has(+ .row[aria-selected="true"])::after { opacity: 0; }
.row:hover { background: var(--color-fill-hover); }
.row[aria-selected="true"] { background: var(--color-fill-selected); }
.row:focus-visible { outline-offset: calc(-1 * var(--focus-ring-width)); }
.row .dot { grid-column: 1; grid-row: 1; width: var(--space-8); height: var(--space-8); margin-top: calc((var(--text-body-leading) - var(--space-8)) / 2); border-radius: var(--radius-full); }
.row.unread .dot { background: var(--color-accent); }
.row .title {
  grid-column: 2; grid-row: 1;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden;
  overflow-wrap: break-word;
  font: var(--text-body); letter-spacing: var(--text-body-tracking);
}
.row.unread .title { font-weight: var(--text-body-weight-emphasized); }
.row time {
  grid-column: 3; grid-row: 1; white-space: nowrap; font-variant-numeric: tabular-nums;
  margin-top: calc((var(--text-body-leading) - var(--text-footnote-leading)) / 2);
  font: var(--text-footnote); letter-spacing: var(--text-footnote-tracking); color: var(--color-label-secondary);
}
.row .preview {
  grid-column: 2 / 4; grid-row: 2; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font: var(--text-subheadline); letter-spacing: var(--text-subheadline-tracking); color: var(--color-label-secondary);
}

/* Accent selection (?selection=accent): only the pane with focus shows it */
[data-selection="accent"] .pane:focus-within .row[aria-selected="true"],
[data-selection="accent"] .pane-sources:focus-within .side-item[aria-current="page"] { background: var(--color-accent); color: var(--color-on-accent); }
[data-selection="accent"] .pane:focus-within .row[aria-selected="true"] time,
[data-selection="accent"] .pane:focus-within .row[aria-selected="true"] .preview,
[data-selection="accent"] .pane-sources:focus-within .side-item[aria-current="page"] i,
[data-selection="accent"] .pane-sources:focus-within .side-item[aria-current="page"] .count { color: var(--color-on-accent); }
[data-selection="accent"] .pane:focus-within .row.unread[aria-selected="true"] .dot { background: var(--color-on-accent); }
[data-selection="accent"] .pane:focus-within .row[aria-selected="true"]:focus-visible,
[data-selection="accent"] .pane-sources:focus-within .side-item[aria-current="page"]:focus-visible { outline-color: var(--color-on-accent); }

/* Empty and no-result states */
.state { display: grid; justify-items: center; text-align: center; gap: var(--space-4); padding: var(--space-48) var(--space-24); }
.state > i { font-size: calc(var(--icon-size-lg) * 1.6); color: var(--color-label-tertiary); margin-bottom: var(--space-8); }
.state h3 { font: var(--text-headline); letter-spacing: var(--text-headline-tracking); overflow-wrap: anywhere; }
.state p { font: var(--text-subheadline); letter-spacing: var(--text-subheadline-tracking); color: var(--color-label-secondary); max-width: 30ch; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; margin-top: var(--space-12);
  min-height: var(--control-height); padding-inline: var(--space-20);
  border: 0; border-radius: var(--radius-control);
  font: var(--text-body); font-weight: var(--text-body-weight-emphasized); letter-spacing: var(--text-body-tracking);
  transition: background-color var(--duration-short) var(--ease-out);
}
.btn-primary { background: var(--color-accent); color: var(--color-on-accent); }
.btn-primary:hover { background: var(--color-accent-hover); }
.btn-primary:active { background: var(--color-accent-pressed); }
.btn-text { background: none; color: var(--color-accent-text); min-height: var(--hit-min); padding-inline: var(--space-12); }
.btn-text:hover { text-decoration: underline; text-underline-offset: var(--space-4); }

.toast {
  position: absolute; z-index: 5; left: var(--space-12); right: var(--space-12); bottom: var(--space-12);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-12);
  padding: var(--space-4) var(--space-8) var(--space-4) var(--space-16);
  background: var(--color-bg-elevated); border-radius: var(--radius-lg); box-shadow: var(--shadow-floating);
  font: var(--text-subheadline); letter-spacing: var(--text-subheadline-tracking);
  animation: fade var(--duration-medium) var(--ease-out) both;
}
.toast .btn { margin: 0; }
@keyframes fade { from { opacity: 0; } }

/* ---------- Detail ---------- */
.detail-empty { flex: 1; display: grid; place-items: center; padding: var(--space-24); color: var(--color-label-secondary); font: var(--text-body); letter-spacing: var(--text-body-tracking); text-align: center; }
.detail-body { padding: var(--space-24) var(--gutter) var(--space-64); }
.doc { max-width: var(--width-prose); margin-inline: auto; font: var(--text-prose); letter-spacing: var(--text-body-tracking); }
.doc header { margin-bottom: var(--space-24); }
.doc h2 { font: var(--text-title-2); letter-spacing: var(--text-title-2-tracking); overflow-wrap: break-word; text-wrap: balance; }
.doc .meta { margin-top: var(--space-8); font: var(--text-subheadline); letter-spacing: var(--text-subheadline-tracking); color: var(--color-label-secondary); }
.editable { border-radius: var(--radius-xs); }
.editable:focus-visible { outline: none; } /* the caret is the focus indicator in text-editing areas */
#d-title:empty::before, #d-body:empty::before { content: attr(data-placeholder); color: var(--color-label-tertiary); }
#d-body p + p { margin-top: var(--space-16); }
#d-body, .doc p { text-wrap: pretty; overflow-wrap: break-word; }
.counts-block { margin-top: var(--space-24); }
.counts-block h3 { font: var(--text-footnote); font-weight: var(--text-footnote-weight-emphasized); letter-spacing: var(--text-footnote-tracking); color: var(--color-label-secondary); margin-bottom: var(--space-8); }
.counts { list-style: none; padding: 0; border-top: 1px solid var(--color-separator); }
.counts li { display: flex; justify-content: space-between; gap: var(--space-16); padding: var(--space-8) 0; border-bottom: 1px solid var(--color-separator); font: var(--text-body); letter-spacing: var(--text-body-tracking); }
.counts .n { font-variant-numeric: tabular-nums; color: var(--color-label-secondary); }

/* ---------- Tablet: sidebar behind a toggle (700 to 999px) ---------- */
.scrim { display: none; }
@media (min-width: 1000px) {
  .split.sidebar-collapsed { grid-template-columns: clamp(320px, 30vw, 400px) minmax(0, 1fr); }
  .split.sidebar-collapsed .pane-sources { display: none; }
}
@media (min-width: 700px) and (max-width: 999.98px) {
  .split { grid-template-columns: clamp(320px, 30vw, 400px) minmax(0, 1fr); }
  .pane-sources {
    position: fixed; inset: 0 auto 0 0; z-index: 30; width: var(--sidebar-width);
    opacity: 0; visibility: hidden; transform: translateX(calc(-100% * var(--motion-scale)));
    transition: opacity var(--duration-long) var(--ease-out), transform var(--duration-long) var(--ease-out), visibility 0s linear var(--duration-long);
  }
  .split.sidebar-open .pane-sources { opacity: 1; visibility: visible; transform: none; box-shadow: var(--shadow-overlay); transition-delay: 0s; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: var(--color-scrim); opacity: 0; pointer-events: none; transition: opacity var(--duration-long) var(--ease-out); }
  .split.sidebar-open .scrim { opacity: 1; pointer-events: auto; }
}

/* ---------- Phone: one pane at a time (< 700px) ---------- */
@media (max-width: 699.98px) {
  .split { display: block; }
  .pane { position: absolute; inset: 0; border: 0; transition: opacity var(--duration-long) var(--ease-out), transform var(--duration-long) var(--ease-out), visibility 0s; }
  .pane:not(.is-current) { visibility: hidden; opacity: 0; pointer-events: none; transition-delay: 0s, 0s, var(--duration-long); }
  .pane-sources:not(.is-current), .pane-list:not(.is-current) { transform: translateX(calc(-1 * var(--space-24) * var(--motion-scale))); }
  .pane-detail:not(.is-current) { transform: translateX(calc(var(--space-24) * var(--motion-scale))); }
  .back-btn { display: inline-flex; }
  .toggle-sidebar { display: none; }
  .bar { padding-inline: var(--space-4); }
  .bar-list { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) minmax(0, 1fr); }
  .bar-list h2 { text-align: center; padding-inline: var(--space-4); }
  .bar-list .bar-start { min-width: 0; }
  .bar-list .bar-end { justify-self: end; }
  .side-item .chev { display: block; }
  .detail-body { padding-top: var(--space-16); }
}

@media (prefers-reduced-motion: reduce) {
  .toast { animation: none; }
}
</style>
</head>
<body>
<h1 class="visually-hidden">Kestrel</h1>
<p class="visually-hidden" id="status" role="status" aria-live="polite"></p>

<div class="split" id="split">
  <nav class="pane pane-sources" id="sources" aria-label="Library and notebooks">
    <header class="bar"><p class="brand"><i class="ph ph-bird" aria-hidden="true"></i>Kestrel</p></header>
    <div class="scroll">
      <div class="side-group">
        <h2 id="sg-library">Library</h2>
        <ul class="side-list" aria-labelledby="sg-library">
          <li><a class="side-item" href="#/all-notes"><i class="ph ph-notebook" aria-hidden="true"></i><span class="label">All notes</span><span class="count">214</span><i class="ph ph-caret-right chev" aria-hidden="true"></i></a></li>
          <li><a class="side-item" href="#/sightings"><i class="ph ph-binoculars" aria-hidden="true"></i><span class="label">Sightings</span><span class="count">63</span><i class="ph ph-caret-right chev" aria-hidden="true"></i></a></li>
          <li><a class="side-item" href="#/transects"><i class="ph ph-path" aria-hidden="true"></i><span class="label">Transects</span><span class="count">18</span><i class="ph ph-caret-right chev" aria-hidden="true"></i></a></li>
          <li><a class="side-item" href="#/photos"><i class="ph ph-image" aria-hidden="true"></i><span class="label">Photos</span><span class="count">97</span><i class="ph ph-caret-right chev" aria-hidden="true"></i></a></li>
        </ul>
      </div>
      <div class="side-group">
        <h2 id="sg-books">Notebooks</h2>
        <ul class="side-list" aria-labelledby="sg-books">
          <li><a class="side-item" href="#/moorland-2026"><i class="ph ph-folder" aria-hidden="true"></i><span class="label">Moorland 2026</span><i class="ph ph-caret-right chev" aria-hidden="true"></i></a></li>
          <li><a class="side-item" href="#/wetland-survey"><i class="ph ph-folder" aria-hidden="true"></i><span class="label">Wetland survey</span><i class="ph ph-caret-right chev" aria-hidden="true"></i></a></li>
          <li><a class="side-item" href="#/coastal-cliff-transects"><i class="ph ph-folder" aria-hidden="true"></i><span class="label">Coastal cliff transects, spring season</span><i class="ph ph-caret-right chev" aria-hidden="true"></i></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="pane pane-list" id="list-pane" aria-labelledby="list-title">
    <header class="bar bar-list">
      <div class="bar-start">
        <button class="back-btn" id="list-back" type="button" aria-label="Back to Kestrel"><i class="ph ph-caret-left" aria-hidden="true"></i><span>Kestrel</span></button>
        <button class="icon-btn toggle-sidebar" id="toggle-sidebar" type="button" aria-label="Hide sidebar" aria-expanded="true" aria-controls="sources"><i class="ph ph-sidebar-simple" aria-hidden="true"></i></button>
      </div>
      <h2 id="list-title">Moorland 2026</h2>
      <div class="bar-end">
      <button class="icon-btn" id="search-btn" type="button" aria-label="Search notes" aria-expanded="false" aria-controls="list-search" aria-keyshortcuts="/"><i class="ph ph-magnifying-glass" aria-hidden="true"></i></button>
      <button class="icon-btn" id="new-btn" type="button" aria-label="New note"><i class="ph ph-note-pencil" aria-hidden="true"></i></button>
      </div>
    </header>
    <div class="list-search" id="list-search" hidden>
      <div class="search" role="search">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <label class="visually-hidden" for="q">Search notes</label>
        <input id="q" type="search" placeholder="Search notes" autocomplete="off" spellcheck="false">
        <button class="clear" id="q-clear" type="button" aria-label="Clear search" hidden><i class="ph-fill ph-x-circle" aria-hidden="true"></i></button>
      </div>
    </div>
    <div class="scroll" id="list-scroll">
      <ul class="rows" id="rows" role="listbox" aria-label="Notes"></ul>
      <div class="state" id="list-state" hidden></div>
    </div>
    <div class="toast" id="toast" hidden><span>Note deleted</span><button class="btn btn-text" id="undo" type="button">Undo</button></div>
  </section>

  <article class="pane pane-detail" id="detail-pane" aria-label="Note">
    <header class="bar">
      <button class="back-btn" id="detail-back" type="button" aria-label="Back to Moorland 2026"><i class="ph ph-caret-left" aria-hidden="true"></i><span>Moorland 2026</span></button>
      <span class="spacer"></span>
      <div class="actions" id="actions">
      <button class="icon-btn" id="pin-btn" type="button" aria-label="Pin note" aria-pressed="false"><i class="ph ph-push-pin" aria-hidden="true"></i></button>
      <button class="icon-btn" id="trash-btn" type="button" aria-label="Delete note"><i class="ph ph-trash" aria-hidden="true"></i></button>
      <button class="icon-btn" type="button" aria-label="Share note"><i class="ph ph-export" aria-hidden="true"></i></button>
      <button class="icon-btn" type="button" aria-label="More actions"><i class="ph ph-dots-three" aria-hidden="true"></i></button>
      </div>
    </header>
    <p class="detail-empty" id="detail-empty" hidden>No note selected</p>
    <div class="scroll" id="detail-scroll">
      <div class="detail-body">
        <div class="doc">
          <header>
            <h2><span class="editable" id="d-title" contenteditable="true" role="textbox" aria-label="Title" data-placeholder="Untitled note" spellcheck="false"></span></h2>
            <p class="meta" id="d-meta"></p>
          </header>
          <div class="editable" id="d-body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Note text" data-placeholder="Start writing"></div>
          <section class="counts-block" id="d-counts" hidden>
            <h3 id="d-counts-title"></h3>
            <ul class="counts" id="d-counts-list" aria-labelledby="d-counts-title"></ul>
          </section>
        </div>
      </div>
    </div>
  </article>
  <div class="scrim" id="scrim"></div>
</div>

<script>
(function () {
  'use strict';
  var root = document.documentElement;
  var params = new URLSearchParams(location.search);
  var t = params.get('theme'); if (t === 'light' || t === 'dark') root.setAttribute('data-theme', t);
  if (params.get('density') === 'compact') root.setAttribute('data-density', 'compact');
  if (params.get('selection') === 'accent') root.setAttribute('data-selection', 'accent');

  /* ---------- Data. Today is Sunday 22 November 2026. ---------- */

  }
  $('new-btn').addEventListener('click', newNote);
  $('pin-btn').addEventListener('click', function () { var n = find(state.selected); if (n) { n.pinned = !n.pinned; syncPin(n); } });
  $('trash-btn').addEventListener('click', function () { if (state.selected) deleteNote(state.selected); });

  function deleteNote(id) {
    var idx = notes.findIndex(function (n) { return n.id === id; }); if (idx < 0) return;
    var items = visibleNotes(), vi = items.findIndex(function (n) { return n.id === id; });
    lastDeleted = { note: notes[idx], idx: idx };
    notes.splice(idx, 1);
    var next = items[vi + 1] || items[vi - 1] || null;
    var wasSelected = state.selected === id;
    if (wasSelected && next) next.unread = false; /* same effect as choose(): opened notes are read */
    if (wasSelected) { state.selected = next ? next.id : null; state.detailId = null; }
    renderList(); renderDetail();
    if (wasSelected && mqPhone.matches && state.screen === 'detail') goBack();
    else if (wasSelected && !mqPhone.matches) {
      history.replaceState({ d: (history.state && history.state.d) || 0 }, '', '#/' + state.source + (next ? '/' + next.id : ''));
      var t = rowsEl.querySelector('[tabindex="0"]'); if (t && pList.contains(document.activeElement) === false) t.focus();
    }
    showToast();
  }
  function hideToast() { toast.hidden = true; lastDeleted = null; }
  function armToast() { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 8000); }
  function showToast() { toast.hidden = false; armToast(); say('Note deleted'); }
  toast.addEventListener('mouseenter', function () { clearTimeout(toastTimer); });
  toast.addEventListener('focusin', function () { clearTimeout(toastTimer); });
  toast.addEventListener('mouseleave', function () { if (!toast.contains(document.activeElement)) armToast(); });
  toast.addEventListener('focusout', function (e) { if (!toast.matches(':hover') && !toast.contains(e.relatedTarget)) armToast(); });
  $('undo').addEventListener('click', undoDelete);
  function undoDelete() {
    if (!lastDeleted) return;
    clearTimeout(toastTimer);
    var d = lastDeleted; lastDeleted = null; toast.hidden = true;
    notes.splice(d.idx, 0, d.note); state.detailId = null;
    renderList(); choose(d.note.id, false);
    var li = $(d.note.id); if (li) li.focus();
  }

  function goBack() {
    if (history.state && history.state.d > 0) history.back();
    else navigate(state.screen === 'detail' ? '#/' + state.source : '#/', { replace: true });
  }
  $('list-back').addEventListener('click', goBack);
  $('detail-back').addEventListener('click', goBack);
  window.addEventListener('popstate', applyRoute);

  /* ---------- In-place editing ---------- */
  function liveRow(n, key, value, fallback) { var li = $(n.id); if (!li) return; var el = li.querySelector(key); if (el) el.textContent = value || fallback; }
  dTitle.addEventListener('input', function () { var n = find(state.selected); if (n) { n.title = dTitle.textContent; liveRow(n, '.t', n.title, 'Untitled note'); } });
  dTitle.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); dBody.focus(); } });
  dTitle.addEventListener('paste', function (e) { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData.getData('text/plain') || '').replace(/\s+/g, ' ')); });
  dBody.addEventListener('paste', function (e) { e.preventDefault(); document.execCommand('insertText', false, e.clipboardData.getData('text/plain')); });
  dBody.addEventListener('input', function () {
    var n = find(state.selected); if (!n) return;
    n.paras = dBody.innerText.split(/\n+/).filter(function (s) { return s.trim(); });
    n.preview = n.paras[0] || '';
    liveRow(n, '.preview', n.preview, 'No text yet');
  });

  /* ---------- Boot ---------- */
  function onResize() { applyRoute(); }
  window.addEventListener('resize', fitBack);
  if (mqPhone.addEventListener) { mqPhone.addEventListener('change', onResize); mqTablet.addEventListener('change', onResize); }
  history.replaceState({ d: 0 }, '', location.href);
  applyRoute();
})();
</script>
</body>
</html>
